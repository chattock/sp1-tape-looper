CONFIG_LOG=n
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_VID=0x1915
CONFIG_SAMPLE_USBD_PID=0x5217
CONFIG_SAMPLE_USBD_MANUFACTURER="softmodded"
CONFIG_SAMPLE_USBD_PRODUCT="SP-1 Files"
CONFIG_SAMPLE_USBD_MAX_POWER=50
CONFIG_WATCHDOG=y
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_ISR_STACK_SIZE=2048
CONFIG_STACK_SENTINEL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

CONFIG_BOOT_BANNER=n

# Maintenance-only USB headroom; normal Tape Looper is not rebuilt.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_NRF_THREAD_STACK_SIZE=2048
CONFIG_HW_STACK_PROTECTION=y

CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0x80000
CONFIG_FLASH_LOAD_SIZE=0x20000

CONFIG_FLASH=y

CONFIG_USBD_MSC_CLASS=y
CONFIG_DISK_ACCESS=y

CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=8192
CONFIG_USBD_MSC_STACK_SIZE=4096

CONFIG_ADC=y

CONFIG_FPU=y

# Maintenance-only measured stack headroom after offline import.
CONFIG_INIT_STACKS=y
