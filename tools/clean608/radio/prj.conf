CONFIG_LOG=n
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_VID=0x1915
CONFIG_SAMPLE_USBD_PID=0x5211
CONFIG_SAMPLE_USBD_MANUFACTURER="softmodded"
CONFIG_SAMPLE_USBD_PRODUCT="SP-1 Bluetooth Setup"
CONFIG_SAMPLE_USBD_MAX_POWER=50
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048
CONFIG_STACK_SENTINEL=y
CONFIG_REBOOT=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

CONFIG_ENTROPY_GENERATOR=y

CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0xa0000
CONFIG_FLASH_LOAD_SIZE=0x40000

# Dedicated bounded controller recovery-page writes require privileged flash write access.
# MPU remains enabled; NVMC stays read-only outside clean607_begin/clear.
CONFIG_MPU_ALLOW_FLASH_WRITE=y
